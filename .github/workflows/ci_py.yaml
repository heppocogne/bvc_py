name: bvc_py CI for Python

on:
  push:
    paths:
      - '**/*.py'
  pull_request:
    paths:
      - '**/*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        # docs/*.md 内の説明用コード片まで書き換えないよう、コードに限定する
        run: ruff format --check src tests tools

      - name: Compile check
        run: python -m compileall -q src

      - name: Run pytest (slow は既定で skip)
        run: python -m pytest -q

      - name: Run unittest
        run: python -m unittest discover -s tests -t .

      - name: Build bvc.pyz
        run: python tools/build_pyz.py

      - name: Verify bvc.pyz
        run: python dist/bvc.pyz --version
