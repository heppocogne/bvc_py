name: bvc_py CI for Documents

on:
  push:
    paths:
      - 'docs/*.md'
  pull_request:
    paths:
      - 'docs/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Table of Contents
        run: |
          npm install --no-save markdown-toc
          doc_files=(
            "docs/01_要件定義書.md"
            "docs/02_仕様書.md"
            "docs/03_設計書.md"
            "docs/04_テスト観点.md"
            "docs/05_実装計画書.md"
            "docs/06_実機確認手順書.md"
          )
          for file in ${doc_files[@]}; do
            npx markdown-toc -i "$file"
          done

      - name: Commit & Push
        run:  |
          git config --global user.name "update_toc:github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.md
          git diff --staged --exit-code || (git commit -m "Update ToC" && git push)
