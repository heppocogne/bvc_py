name: bvc_py CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
      name: Check for secrets
      runs-on: ubuntu-latest
      permissions:
        contents: read
        pull-requests: read # pull_request イベントで対象コミット一覧を取得するために必要
      steps:
        - name: Checkout code
          uses: actions/checkout@v7
          with:
            fetch-depth: 0 # リポジトリの履歴全体

        - name: Run Gitleaks
          uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_toc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update Table of Contents
        run: |
          npm install --no-save markdown-toc
          doc_files=(
            "docs/01_要件定義書.md"
            "docs/02_仕様書.md"
            "docs/03_設計書.md"
            "docs/04_テスト観点.md"
            "docs/05_実装計画書.md"
            "docs/06_実機確認手順書.md"
          )
          for file in ${doc_files[@]}; do
            npx markdown-toc -i "$file"
          done

      - name: Commit & Push
        run:  |
          git config --global user.name "update_toc:github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.md
          git diff --staged --exit-code || (git commit -m "Update ToC" && git push)

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        # docs/*.md 内の説明用コード片まで書き換えないよう、コードに限定する
        run: ruff format --check src tests tools

      - name: Compile check
        run: python -m compileall -q src

      - name: Run pytest (slow は既定で skip)
        run: python -m pytest -q

      - name: Run unittest
        run: python -m unittest discover -s tests -t .

      - name: Build bvc.pyz
        run: python tools/build_pyz.py

      - name: Verify bvc.pyz
        run: python dist/bvc.pyz --version
