[project]
name = "bvc_py"
version = "0.1.0"
description = "バイナリファイル向けバージョン管理システムのPython版(試作)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "heppocogne", email = "83043568+heppocogne@users.noreply.github.com" },
]
keywords = ["vcs", "binary", "version-control"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  # "License :: OSI Approved :: MIT License",
  # "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  # "Topic :: System :: Archiving",
]
# 標準ライブラリのみの予定
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0", # カバレッジ測定が必要な場合など
]

[project.urls]
Homepage = "https://github.com/heppocogne/bvc_py"

[project.scripts]
bvc = "bvc.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytester は tests/test_conftest.py(conftest 自体のテスト)で使う
addopts = "-p pytester"
# slow は既定で skip する(tests/conftest.py、実装計画書 6.5節)。
# "-m 'not slow'" を addopts に入れると GUI で個別に選んでも外れるため使わない。
markers = [
    "slow: 時間がかかる(大容量・規模・実際の待機を含む)。--run-slow かノード ID 指定のときだけ実行する",
    "git: git コマンドが必要",
    "kill: 子プロセスを kill する",
    "windows: Windows 固有",
]
